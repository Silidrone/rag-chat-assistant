user www-data;
worker_processes 2;
pid /run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
  use epoll;
}

http {
  server_names_hash_bucket_size 128;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15;
  client_max_body_size 1m;
  types_hash_max_size 2048;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Every question spends the operator's API credit, and in shadow mode an
  # answered one costs two model calls. Two ceilings: per client, so one person
  # cannot loop it, and in aggregate, so a spread of clients cannot either.
  # Static assets are not limited, they cost nothing.
  limit_req_zone $binary_remote_addr zone=ask_per_ip:10m rate=20r/m;
  limit_req_zone $server_name        zone=ask_total:1m   rate=40r/m;
  limit_req_status 429;

  server {
    listen 80;
    listen [::]:80;

    root /usr/src/app/public;
    index index.html;

    # The UI calls these paths directly, exactly as it does behind the Vite
    # proxy in development, so the same build runs in both places with no
    # base-URL switch to get wrong.
    location = /ask {
      # burst with nodelay lets someone click through the examples at once,
      # then holds them to the sustained rate.
      limit_req zone=ask_per_ip burst=5 nodelay;
      limit_req zone=ask_total  burst=10 nodelay;

      proxy_pass http://api:5000/ask;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # One answer can be two model calls: the generation, then the grounding
      # check. Each retries up to three times on a 5xx, so the ceiling is well
      # past nginx's 60s default.
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    location = /health {
      proxy_pass http://api:5000/health;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    # The browser calls /ask with fetch, so a limit has to come back as the
    # JSON the client already knows how to read, not nginx's HTML page.
    error_page 429 = @ratelimited;
    location @ratelimited {
      default_type application/json;
      return 429 '{"error":"Too many questions from this address. Give it a minute."}';
    }

    location ~ /\.ht {
      deny all;
    }

    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;
  }
}
