user www-data;
worker_processes 2;
pid /run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
  use epoll;
}

http {
  server_names_hash_bucket_size 128;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15;
  client_max_body_size 1m;
  types_hash_max_size 2048;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    listen [::]:80;

    root /usr/src/app/public;
    index index.html;

    # The UI calls these paths directly, exactly as it does behind the Vite
    # proxy in development, so the same build runs in both places with no
    # base-URL switch to get wrong.
    location = /ask {
      proxy_pass http://api:5000/ask;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # One answer can be two model calls: the generation, then the grounding
      # check. Each retries up to three times on a 5xx, so the ceiling is well
      # past nginx's 60s default.
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    location = /health {
      proxy_pass http://api:5000/health;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~ /\.ht {
      deny all;
    }

    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;
  }
}
